<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson Story – Cryptocrib Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000;family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="curriculum.js"></script>
    <script src="lesson-content.js"></script>
</head>
<body class="lesson-story-body">
    <!-- Story Container -->
    <div class="lesson-story-container" id="story-container">
        <!-- Split Layout: Text Left, Image Right -->
        <div class="story-split-layout">
            <!-- Left Side: Text Content -->
            <div class="story-text-section">
                <div class="story-header">
                    <div class="story-breadcrumb" id="story-breadcrumb">Chapter 1, Intro</div>
                    <h1 class="story-title" id="story-title">Miner protest</h1>
                </div>
                
                <div class="story-content" id="story-content">
                    <!-- Story content loaded dynamically from lesson-content.js -->
                </div>
                
                <div class="story-actions">
                    <button class="btn-continue-story" id="btn-continue-story">Continue</button>
                </div>
            </div>

            <!-- Right Side: Illustration -->
            <div class="story-image-section" id="story-image-section">
                <!-- Background image applied via CSS -->
            </div>
        </div>
    </div>

    <script>
        // Check authentication
        (function() {
            const authData = localStorage.getItem('cryptocrib_auth');
            if (!authData) {
                window.location.href = 'auth.html';
                return;
            }
            try {
                const auth = JSON.parse(authData);
                if (!auth.isLoggedIn) {
                    window.location.href = 'auth.html';
                    return;
                }
            } catch (e) {
                window.location.href = 'auth.html';
                return;
            }
        })();

        // Make curriculum data available globally
        if (typeof CURRICULUM !== 'undefined') {
            window.CURRICULUM = CURRICULUM;
        }

        // Initialize story page
        document.addEventListener('DOMContentLoaded', function() {
            // Parse URL - support hash-based format with optional page number
            // Format: #/path/chapter/lesson/page
            let pathId, chapterId, lessonId, pageNumber = 1;
            
            const hash = window.location.hash;
            if (hash && hash.startsWith('#/')) {
                const parts = hash.substring(2).split('/');
                if (parts.length >= 3) {
                    pathId = parts[0];
                    chapterId = parts[1];
                    lessonId = parts[2];
                    // Page number is optional (defaults to 1)
                    if (parts.length >= 4 && parts[3]) {
                        pageNumber = parseInt(parts[3]) || 1;
                    }
                }
            }
            
            // Fallback to query parameters
            if (!pathId || !chapterId || !lessonId) {
                const urlParams = new URLSearchParams(window.location.search);
                pathId = urlParams.get('path') || 'beginner';
                chapterId = urlParams.get('chapter') || 'ch1-blockchain-basics';
                lessonId = urlParams.get('lesson') || '1-1';
                pageNumber = parseInt(urlParams.get('page')) || 1;
            }

            if (!window.CURRICULUM || !window.CURRICULUM[pathId]) {
                console.error('Path not found');
                window.location.href = 'courses.html';
                return;
            }

            const path = window.CURRICULUM[pathId];
            const chapter = path.chapters.find(ch => ch.id === chapterId);
            if (!chapter) {
                console.error('Chapter not found');
                window.location.href = 'courses.html';
                return;
            }

            const lesson = chapter.lessons.find(l => l.id === lessonId);
            if (!lesson) {
                console.error('Lesson not found');
                window.location.href = 'courses.html';
                return;
            }

            // Get chapter number
            const chapterMatch = chapter.title.match(/\d+/);
            const chapterNumber = chapterMatch ? chapterMatch[0] : '1';

            // Update breadcrumb and title
            document.getElementById('story-breadcrumb').textContent = `Chapter ${chapterNumber}, Intro`;
            
            // Get story title from lesson content or use lesson title
            const storyTitleElement = document.getElementById('story-title');
            if (window.LESSON_CONTENT && window.LESSON_CONTENT[lesson.id] && window.LESSON_CONTENT[lesson.id].storyTitle) {
                storyTitleElement.textContent = window.LESSON_CONTENT[lesson.id].storyTitle;
            } else {
                storyTitleElement.textContent = lesson.title;
            }

            // Load story content with pagination
            const pages = splitContentIntoPages(lesson);
            let currentPageNumber = pageNumber; // Store current page number (mutable)
            
            loadStoryContent(lesson, chapter, pages, currentPageNumber);

            // Setup continue button - navigate to next page or next lesson
            document.getElementById('btn-continue-story').addEventListener('click', function() {
                // Get current page number from URL
                const hash = window.location.hash;
                let urlPageNumber = currentPageNumber;
                if (hash && hash.startsWith('#/')) {
                    const parts = hash.substring(2).split('/');
                    if (parts.length >= 4 && parts[3]) {
                        urlPageNumber = parseInt(parts[3]) || 1;
                    }
                }
                
                // Check if there's a next page in current lesson
                if (urlPageNumber < pages.length) {
                    // Go to next page of same lesson
                    window.location.href = `lesson-story.html#/${pathId}/${chapterId}/${lessonId}/${urlPageNumber + 1}`;
                } else {
                    // Last page of current lesson, go to first page of next lesson
                    const currentLessonIndex = chapter.lessons.findIndex(l => l.id === lessonId);
                    
                    if (currentLessonIndex >= 0 && currentLessonIndex < chapter.lessons.length - 1) {
                        // Go to first page of next lesson
                        const nextLesson = chapter.lessons[currentLessonIndex + 1];
                        window.location.href = `lesson-story.html#/${pathId}/${chapterId}/${nextLesson.id}/1`;
                    } else {
                        // Last lesson in chapter, go to first page of first lesson in next chapter (if exists)
                        // or back to lesson summary page
                        const currentChapterIndex = path.chapters.findIndex(ch => ch.id === chapterId);
                        if (currentChapterIndex >= 0 && currentChapterIndex < path.chapters.length - 1) {
                            // Go to first lesson of next chapter
                            const nextChapter = path.chapters[currentChapterIndex + 1];
                            if (nextChapter.lessons.length > 0) {
                                const firstLesson = nextChapter.lessons[0];
                                window.location.href = `lesson-story.html#/${pathId}/${nextChapter.id}/${firstLesson.id}/1`;
                            } else {
                                window.location.href = `lesson.html#/${pathId}/${chapterId}/${lessonId}`;
                            }
                        } else {
                            // Last lesson in last chapter, go back to lesson summary page
                            window.location.href = `lesson.html#/${pathId}/${chapterId}/${lessonId}`;
                        }
                    }
                }
            });

            // Set background image based on chapter
            const chapterImages = {
                'ch1-blockchain-basics': 'chapter-1',
                'ch2-bitcoin': 'chapter-2',
                'ch3-wallets': 'chapter-3',
                'ch4-ethereum-basics': 'chapter-4',
                'ch5-layer2': 'chapter-5'
            };
            const imageClass = chapterImages[chapterId] || 'chapter-1';
            const imageSection = document.getElementById('story-image-section');
            if (imageSection) {
                imageSection.className = 'story-image-section ' + imageClass;
            }

            function splitContentIntoPages(lesson) {
                let fullContent = '';
                
                // Get content from lesson-content.js
                if (window.LESSON_CONTENT && window.LESSON_CONTENT[lesson.id]) {
                    const content = window.LESSON_CONTENT[lesson.id];
                    
                    // Prefer storyDialogue, then story
                    if (content.storyDialogue) {
                        fullContent = content.storyDialogue;
                    } else if (content.story) {
                        fullContent = content.story.replace(/<div[^>]*>/g, '').replace(/<\/div>/g, '').trim();
                    }
                }
                
                // If no content, create default
                if (!fullContent) {
                    fullContent = `<p>Welcome to ${lesson.title}. Let's begin exploring this topic.</p>`;
                }
                
                // Split content into paragraphs
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = fullContent;
                const paragraphs = Array.from(tempDiv.querySelectorAll('p'));
                
                // Group paragraphs into pages (2-3 paragraphs per page)
                const pages = [];
                const paragraphsPerPage = 2; // Show 2 paragraphs per page
                
                for (let i = 0; i < paragraphs.length; i += paragraphsPerPage) {
                    const pageParagraphs = paragraphs.slice(i, i + paragraphsPerPage);
                    const pageContent = pageParagraphs.map(p => p.outerHTML).join('');
                    pages.push(pageContent);
                }
                
                // If no paragraphs found, return single page with original content
                if (pages.length === 0) {
                    pages.push(fullContent);
                }
                
                return pages;
            }

            function loadStoryContent(lesson, chapter, pages, pageNumber) {
                const storyContent = document.getElementById('story-content');
                
                // Ensure pageNumber is within bounds
                const currentPage = Math.min(Math.max(1, pageNumber), pages.length);
                
                // Display the current page content
                storyContent.innerHTML = pages[currentPage - 1] || pages[0] || '';
                
                // Update URL if page number was corrected
                if (currentPage !== pageNumber) {
                    window.history.replaceState(null, '', `lesson-story.html#/${pathId}/${chapterId}/${lessonId}/${currentPage}`);
                }
            }
        });
    </script>
</body>
</html>
