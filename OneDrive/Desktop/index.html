<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Press Start 2P', monospace;
  }

  #gameWrapper {
    position: relative;
    border: 4px solid #533e2d;
    border-radius: 8px;
    box-shadow: 0 0 40px rgba(255, 200, 50, 0.15), inset 0 0 20px rgba(0,0,0,0.3);
  }

  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    z-index: 10;
  }

  #overlay.active { pointer-events: all; }

  .title {
    color: #fff;
    font-size: 28px;
    text-shadow: 3px 3px 0 #533e2d, -1px -1px 0 #533e2d;
    margin-bottom: 20px;
    letter-spacing: 2px;
    animation: bob 1.5s ease-in-out infinite;
  }

  .subtitle {
    color: #f5deb3;
    font-size: 11px;
    text-shadow: 2px 2px 0 #333;
    animation: pulse 1.8s ease-in-out infinite;
  }

  .score-display {
    color: #ffd700;
    font-size: 18px;
    margin-bottom: 15px;
    text-shadow: 2px 2px 0 #333;
  }

  .best-score {
    color: #c0c0c0;
    font-size: 10px;
    margin-bottom: 25px;
    text-shadow: 1px 1px 0 #333;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .mode-buttons {
    display: flex;
    gap: 15px;
    margin-top: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .mode-btn {
    padding: 10px 20px;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    border: 3px solid #533e2d;
    border-radius: 4px;
    background: #2a2a3e;
    color: #fff;
    cursor: pointer;
    transition: all 0.2s;
    text-shadow: 2px 2px 0 #333;
  }

  .mode-btn:hover {
    background: #3a3a4e;
    box-shadow: 0 0 15px rgba(255, 200, 50, 0.3);
  }

  .mode-btn.easy { color: #7dff7d; }
  .mode-btn.easy:hover { border-color: #7dff7d; }

  .mode-btn.medium { color: #ffdb58; }
  .mode-btn.medium:hover { border-color: #ffdb58; }

  .mode-btn.hard { color: #ff6b6b; }
  .mode-btn.hard:hover { border-color: #ff6b6b; }
</style>
</head>
<body>

<div id="gameWrapper">
  <canvas id="game"></canvas>
  <div id="overlay" class="active">
    <div class="title">FLAPPY BIRD</div>
    <div class="subtitle">CLICK OR PRESS SPACE TO PLAY</div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');

// Game dimensions
const W = 400, H = 600;
canvas.width = W;
canvas.height = H;

// Game state
let state = 'mode-select'; // mode-select, start, playing, dead
let bird, pipes, score, bestScore = 0, frame = 0;
let groundX = 0;
let difficulty = 'medium'; // easy, medium, hard

// Physics - defaults (will be overridden by difficulty)
let GRAVITY = 0.45;
let FLAP = -7.5;
let PIPE_SPEED = 2.5;
let PIPE_GAP = 140;
const PIPE_WIDTH = 56;
let PIPE_INTERVAL = 100; // frames between pipes
const GROUND_H = 80;
const BIRD_SIZE = 20;

// Difficulty presets
const DIFFICULTIES = {
  easy: {
    GRAVITY: 0.35,
    FLAP: -9.5,
    PIPE_SPEED: 1.8,
    PIPE_GAP: 180,
    PIPE_INTERVAL: 120
  },
  medium: {
    GRAVITY: 0.45,
    FLAP: -7.5,
    PIPE_SPEED: 2.5,
    PIPE_GAP: 140,
    PIPE_INTERVAL: 100
  },
  hard: {
    GRAVITY: 0.55,
    FLAP: -6.5,
    PIPE_SPEED: 3.5,
    PIPE_GAP: 100,
    PIPE_INTERVAL: 85
  }
};

// Colors (retro palette)
const SKY_TOP = '#4ec0ca';
const SKY_BOT = '#e8f0d0';
const GROUND_COLOR = '#ded895';
const GROUND_DARK = '#533e2d';
const PIPE_GREEN = '#74bf2e';
const PIPE_GREEN_DARK = '#558b2f';
const PIPE_GREEN_LIGHT = '#8bc34a';
const PIPE_CAP_H = 26;

function resetGame() {
  bird = { x: 80, y: H / 2 - 30, vy: 0, angle: 0, flapFrame: 0 };
  pipes = [];
  score = 0;
  frame = 0;
  
  // Apply difficulty settings
  const diff = DIFFICULTIES[difficulty];
  GRAVITY = diff.GRAVITY;
  FLAP = diff.FLAP;
  PIPE_SPEED = diff.PIPE_SPEED;
  PIPE_GAP = diff.PIPE_GAP;
  PIPE_INTERVAL = diff.PIPE_INTERVAL;
}

function flap() {
  if (state === 'mode-select') {
    // Do nothing - wait for mode selection via buttons
    return;
  } else if (state === 'start') {
    state = 'playing';
    overlay.classList.remove('active');
    overlay.innerHTML = '';
    resetGame();
  } else if (state === 'playing') {
    bird.vy = FLAP;
    bird.flapFrame = frame;
  } else if (state === 'dead') {
    state = 'mode-select';
    showModeSelect();
  }
}

function selectMode(mode) {
  difficulty = mode;
  state = 'start';
  showStart();
}

function showModeSelect() {
  overlay.innerHTML = `
    <div class="title">FLAPPY BIRD</div>
    <div class="subtitle" style="margin-bottom: 20px;">SELECT DIFFICULTY</div>
    <div class="mode-buttons">
      <button class="mode-btn easy" onclick="selectMode('easy')">EASY</button>
      <button class="mode-btn medium" onclick="selectMode('medium')">MEDIUM</button>
      <button class="mode-btn hard" onclick="selectMode('hard')">HARD</button>
    </div>
  `;
  overlay.classList.add('active');
}

function showStart() {
  resetGame();
  overlay.innerHTML = `
    <div class="title">FLAPPY BIRD</div>
    <div class="subtitle">CLICK OR PRESS SPACE TO PLAY</div>
  `;
  overlay.classList.add('active');
}

function showDead() {
  if (score > bestScore) bestScore = score;
  overlay.innerHTML = `
    <div class="title" style="font-size:22px;color:#ff6b6b;">GAME OVER</div>
    <div class="score-display">Score: ${score}</div>
    <div class="best-score">Best: ${bestScore}</div>
    <div class="subtitle">CLICK OR PRESS SPACE TO RETRY</div>
  `;
  overlay.classList.add('active');
}

function die() {
  state = 'dead';
  showDead();
}

// Drawing helpers
function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, H - GROUND_H);
  grad.addColorStop(0, SKY_TOP);
  grad.addColorStop(1, SKY_BOT);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H - GROUND_H);

  // Clouds
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  drawCloud(50 + ((frame * 0.3) % (W + 200)) - 100, 80, 1);
  drawCloud(220 + ((frame * 0.2) % (W + 200)) - 100, 140, 0.7);
  drawCloud(350 + ((frame * 0.25) % (W + 200)) - 100, 60, 0.85);
}

function drawCloud(x, y, s) {
  ctx.beginPath();
  ctx.arc(x % (W + 100) - 50, y, 20 * s, 0, Math.PI * 2);
  ctx.arc((x + 25) % (W + 100) - 50, y - 8, 18 * s, 0, Math.PI * 2);
  ctx.arc((x + 50) % (W + 100) - 50, y, 22 * s, 0, Math.PI * 2);
  ctx.arc((x + 20) % (W + 100) - 50, y + 5, 14 * s, 0, Math.PI * 2);
  ctx.fill();
}

function drawGround() {
  // Ground body
  ctx.fillStyle = GROUND_COLOR;
  ctx.fillRect(0, H - GROUND_H, W, GROUND_H);

  // Ground top stripe
  ctx.fillStyle = GROUND_DARK;
  ctx.fillRect(0, H - GROUND_H, W, 4);

  // Ground pattern (scrolling)
  ctx.fillStyle = '#c4b57a';
  for (let x = -groundX % 24; x < W; x += 24) {
    ctx.fillRect(x, H - GROUND_H + 8, 12, 4);
    ctx.fillRect(x + 12, H - GROUND_H + 18, 12, 4);
  }
}

function drawPipe(pipe) {
  const topH = pipe.topH;
  const botY = topH + PIPE_GAP;

  // Top pipe body
  ctx.fillStyle = PIPE_GREEN;
  ctx.fillRect(pipe.x, 0, PIPE_WIDTH, topH - PIPE_CAP_H);
  // Top pipe cap
  ctx.fillStyle = PIPE_GREEN_DARK;
  ctx.fillRect(pipe.x - 4, topH - PIPE_CAP_H, PIPE_WIDTH + 8, PIPE_CAP_H);
  // Highlight
  ctx.fillStyle = PIPE_GREEN_LIGHT;
  ctx.fillRect(pipe.x + 4, 0, 8, topH - PIPE_CAP_H);
  ctx.fillRect(pipe.x, topH - PIPE_CAP_H + 2, PIPE_WIDTH + 8 - 8, 4);

  // Bottom pipe body
  ctx.fillStyle = PIPE_GREEN;
  ctx.fillRect(pipe.x, botY + PIPE_CAP_H, PIPE_WIDTH, H - GROUND_H - botY - PIPE_CAP_H);
  // Bottom pipe cap
  ctx.fillStyle = PIPE_GREEN_DARK;
  ctx.fillRect(pipe.x - 4, botY, PIPE_WIDTH + 8, PIPE_CAP_H);
  // Highlight
  ctx.fillStyle = PIPE_GREEN_LIGHT;
  ctx.fillRect(pipe.x + 4, botY + PIPE_CAP_H, 8, H - GROUND_H - botY - PIPE_CAP_H);
  ctx.fillRect(pipe.x, botY + PIPE_CAP_H - 6, PIPE_WIDTH + 8 - 8, 4);
}

function drawBird() {
  const { x, y, angle } = bird;
  ctx.save();
  ctx.translate(x, y);

  // Tilt based on velocity
  const targetAngle = Math.min(Math.max(bird.vy * 4, -30), 70);
  bird.angle += (targetAngle - bird.angle) * 0.15;
  ctx.rotate(bird.angle * Math.PI / 180);

  // Wing flap animation
  const wingPhase = Math.sin((frame - bird.flapFrame) * 0.5);

  // Body (yellow)
  ctx.fillStyle = '#f5c842';
  ctx.beginPath();
  ctx.ellipse(0, 0, BIRD_SIZE, BIRD_SIZE * 0.8, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body outline
  ctx.strokeStyle = '#d4a017';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Belly
  ctx.fillStyle = '#fce4a8';
  ctx.beginPath();
  ctx.ellipse(2, 4, BIRD_SIZE * 0.55, BIRD_SIZE * 0.45, 0, 0, Math.PI * 2);
  ctx.fill();

  // Wing
  ctx.fillStyle = '#e8b830';
  ctx.beginPath();
  ctx.ellipse(-4, -2 + wingPhase * 6, 10, 6, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#c49a20';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Eye (white)
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(10, -6, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Pupil
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(12, -6, 3.5, 0, Math.PI * 2);
  ctx.fill();

  // Pupil shine
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(13, -7.5, 1.2, 0, Math.PI * 2);
  ctx.fill();

  // Beak
  ctx.fillStyle = '#e8572a';
  ctx.beginPath();
  ctx.moveTo(16, 0);
  ctx.lineTo(28, 2);
  ctx.lineTo(16, 6);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#c94420';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.restore();
}

function drawScore() {
  if (state !== 'playing') return;
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 4;
  ctx.font = '36px "Press Start 2P", monospace';
  ctx.textAlign = 'center';
  ctx.strokeText(score, W / 2, 60);
  ctx.fillText(score, W / 2, 60);
}

// Collision detection
function collides() {
  const bx = bird.x, by = bird.y, br = BIRD_SIZE - 3;

  // Ground/ceiling
  if (by + br > H - GROUND_H || by - br < 0) return true;

  for (const p of pipes) {
    const px = p.x - 4, pw = PIPE_WIDTH + 8;
    // Check horizontal overlap
    if (bx + br > px && bx - br < px + pw) {
      // Top pipe
      if (by - br < p.topH) return true;
      // Bottom pipe
      if (by + br > p.topH + PIPE_GAP) return true;
    }
  }
  return false;
}

function update() {
  if (state !== 'playing') return;

  frame++;
  groundX = (groundX + PIPE_SPEED) % 24;

  // Bird physics
  bird.vy += GRAVITY;
  bird.y += bird.vy;

  // Spawn pipes
  if (frame % PIPE_INTERVAL === 0) {
    const minTop = 60;
    const maxTop = H - GROUND_H - PIPE_GAP - 60;
    const topH = minTop + Math.random() * (maxTop - minTop);
    pipes.push({ x: W + 10, topH, scored: false });
  }

  // Move pipes
  for (let i = pipes.length - 1; i >= 0; i--) {
    pipes[i].x -= PIPE_SPEED;

    // Score
    if (!pipes[i].scored && pipes[i].x + PIPE_WIDTH < bird.x) {
      pipes[i].scored = true;
      score++;
    }

    // Remove off-screen
    if (pipes[i].x < -PIPE_WIDTH - 10) {
      pipes.splice(i, 1);
    }
  }

  // Collision
  if (collides()) die();
}

function render() {
  ctx.clearRect(0, 0, W, H);
  drawSky();

  // Pipes
  for (const p of pipes) drawPipe(p);

  drawGround();
  drawBird();
  drawScore();
}

function loop() {
  if (state === 'mode-select') {
    // On mode select, just draw sky and ground with bird bobbing
    frame++;
    bird.y = H / 2 - 30 + Math.sin(frame * 0.06) * 12;
    groundX = (groundX + 1) % 24;
  } else if (state === 'start') {
    // Animate bird bobbing on start screen
    frame++;
    bird.y = H / 2 - 30 + Math.sin(frame * 0.06) * 12;
    groundX = (groundX + 1) % 24;
  }
  update();
  render();
  requestAnimationFrame(loop);
}

// Input
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    flap();
  }
});
canvas.addEventListener('click', flap);
canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); });

// Init
resetGame();
showModeSelect();
loop();
</script>
</body>
</html>
